# ===== SMPCore =====
server-name: "XUROSMP"          # Platzhalter %server%
server-ip: "xurosmp.daronlo.com" # Platzhalter %ip% (klein) und %IP% (GROSS) in Scoreboard und TAB
number-comma: true              # true = 48,64M (deutsch) | false = 48.64M

# Chat-Prefix pro Befehl: "AH ▸", "HOME ▸", "ORDER ▸" ... (maximal 5 Zeichen, MiniMessage-Farben erlaubt)
# Bedrock-Hinweis: Falls "▸" bei Bedrock-Spielern nicht angezeigt wird, hier z.B. auf "»" ändern.
prefix-format: "<green><bold>%tag%</bold> <dark_gray>▸ <gray>"
prefixes:
  default: "SMP"
  balance: "MONEY"
  pay: "PAY"
  eco: "ECO"
  crystals: "STARS"
  crystalshop: "STARS"
  gems: "GEMS"
  gemshop: "GEMS"
  top: "TOP"
  shop: "SHOP"
  sell: "SELL"
  ah: "AH"
  bounty: "BNTY"
  crate: "KEYS"
  keyall: "KEYS"
  adminpanel: "ADMIN"
  smpcore: "SMP"
  rank: "RANK"
  spawner: "SPAWN"
  tool: "TOOL"
  spawn: "SPAWN"
  setspawn: "SPAWN"
  sethome: "HOME"
  home: "HOME"
  delhome: "HOME"
  homes: "HOME"
  tpa: "TPA"
  tpaccept: "TPA"
  tpdeny: "TPA"
  rtp: "RTP"
  daily: "DAILY"
  stats: "STATS"
  scoreboard: "SB"
  afk: "AFK"
  clan: "CLAN"
  order: "ORDER"
  warp: "WARP"
  setwarp: "WARP"
  delwarp: "WARP"
  kit: "KIT"
  back: "BACK"
  msg: "MSG"
  r: "MSG"
  heal: "HEAL"
  feed: "FEED"
  fly: "FLY"
  craft: "CRAFT"
  ec: "EC"
  trash: "TRASH"
  vanish: "HIDE"
  info: "INFO"

# Floodgate/Geyser: Prefix für Bedrock-Namen (Standard ".")
bedrock-prefix: "."

# Wartungsmodus: nur Spieler mit smpcore.admin dürfen joinen (auch im Admin Panel schaltbar)
maintenance: false

chat:
  rank-format: true   # Rang-Prefix im Chat

# Features an/aus (geht auch im Admin Panel)
features:
  shop: true
  auction: true
  bounty: true
  crates: true
  scoreboard: true
  orders: true

economy:
  starting-money: 1000
  starting-crystals: 0     # Kristalle = AFK-Währung
  starting-gems: 0         # Gems = Store-Währung

# Kristalle = AFK-Währung (verdient in der AFK-Zone, ausgegeben im Kristall-Shop /crystalshop).
# Optional zusätzlich pro Kill / Spielzeit (Standard: aus):
crystals:
  per-kill: 0
  anti-farm-minutes: 10
  playtime-minutes: 0
  playtime-amount: 1

# AFK-Zone: Admin setzt sie mit /afk pos1, /afk pos2, /afk setspawn. Spieler kommen mit /afk hin.
afk:
  enabled: true
  interval-seconds: 60     # alle X Sekunden in der Zone
  crystals: 1              # Kristalle pro Intervall (Rang-Bonus siehe ranks.yml: afk-bonus)

# Clans
clans:
  create-cost: 50000
  max-members: 10

# Automatischer Keyall: alle X Minuten bekommen alle Online-Spieler Keys
keyall:
  enabled: true
  interval-minutes: 60
  crate: common
  amount: 1

auction:
  max-listings: 10          # Standard, Ränge können das in ranks.yml überschreiben
  duration-hours: 48
  tax-percent: 5
  min-price: 1
  max-price: 1000000000000

bounty:
  min-amount: 1000

crates:
  broadcast-chance-below: 5.0   # Gewinne mit weniger als X% Chance werden gebroadcastet

teleport:
  delay-seconds: 3

homes:
  max: 3                    # Standard, Ränge können das in ranks.yml überschreiben

rtp:
  world: world
  min-radius: 500
  max-radius: 5000
  cooldown-seconds: 60

daily:
  money: 500
  streak-bonus: 100      # pro Streak-Tag zusätzlich
  max-streak: 7
  crystals: 0          # Kristalle sind AFK-Währung, daher standardmäßig 0

# Orders (Kaufaufträge): /order. Geld wird beim Erstellen reserviert, Lieferanten werden sofort bezahlt.
orders:
  input: SIGN            # SIGN = Eingabe per Schild (auch Bedrock), CHAT = per Chat
  max-per-player: 5
  duration-hours: 72
  min-price: 0.01
  max-amount: 2304
  blacklist: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, STRUCTURE_VOID, JIGSAW, DEBUG_STICK, SPAWNER, LIGHT]

# Eigene TAB-Liste: Header/Footer, Name mit [CLAN] + Rang-Prefix, Sortierung nach Rang.
# nametag-prefix: Rang-Prefix auch über dem Kopf. Platzhalter wie beim Scoreboard.
tab:
  enabled: true
  nametag-prefix: true
  header:
    - ""
    - "<aqua><bold>⚔ %server% ⚔"
    - ""
    - "<green>%online% Spieler <gray>(%ping%ms)"
    - ""
  footer:
    - ""
    - "<white><bold>%IP%"
    - ""

# Announcer: automatische Chat-Nachrichten
announcer:
  enabled: true
  interval-seconds: 300
  messages:
    - "<yellow>Tipp: <gray>Mit <white>/afk <gray>verdienst du Kristalle in der AFK-Zone!"
    - "<yellow>Tipp: <gray>Im <white>/shop <gray>kannst du kaufen und verkaufen."
    - "<yellow>Tipp: <gray>Mit <white>/order <gray>bestellst du Items zu deinem Preis."
    - "<yellow>Tipp: <gray>Gründe einen Clan mit <white>/clan<gray>!"
    - "<yellow>Tipp: <gray>Hol dir kostenlose Kits mit <white>/kit<gray>."

# Scoreboard exakt im HugoSMP-Look (Reihenfolge wie im Original).
# Die Symbole sind normale Unicode-Zeichen. Mit einem Resource-Pack kannst du sie durch eigene Icons ersetzen.
# Hinweis: "Stars" zeigt die Kristalle (AFK-Währung). Platzhalter siehe unten.
# Platzhalter: %player% %money% %gems% %crystals% %kills% %deaths% %playtime% %online% %max% %bounty% %ping% %rank% %keyall% %clan% %server% %ip% %IP%
scoreboard:
  title: "<gradient:#ff5555:#ffaa00><bold>XUROSMP</bold></gradient>"
  lines:
    - "<green>$ <white>Geld <green>%money%"
    - "<light_purple>♦ <white>Gems <light_purple>%gems%"
    - "<yellow>★ <white>Stars <yellow>%crystals%"
    - "<gray>⚔ <white>Kills <gold>%kills%"
    - "<dark_red>☠ <white>Tode <red>%deaths%"
    - "<gold>⚑ <white>Clan <yellow>%clan%"
    - "<aqua>⚡ <white>Ping <green>%ping%ms"
    - "<aqua>✦ <white>Keyall <aqua>%keyall%"
    - "<green>⌚ <white>Spielzeit <green>%playtime%"
    - " "
    - "<red><bold>%IP%"
    - "<green>%online%/%max%"
