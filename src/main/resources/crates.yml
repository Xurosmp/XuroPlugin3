  choose:
    name: "<yellow><bold>Wahl-Crate"
    key-name: "<yellow>Wahl-Key"
    icon: TRAPPED_CHEST
    mode: CHOOSE
    rewards:
      - {type: MONEY, amount: 50000, chance: 1}
      - {type: CRYSTALS, amount: 15, chance: 1}
      - {type: ITEM, material: DIAMOND_BLOCK, amount: 4, chance: 1}
      - {type: ITEM, material: TOTEM_OF_UNDYING, amount: 2, chance: 1}
