# Kits: /kit (Menü) oder /kit <id>.  cooldown in Sekunden, -1 = nur einmal. permission leer = für alle.
# Rang-Kits: Ränge erhalten die Permission smpcore.kit.<rang> automatisch (siehe ranks.yml, wird vererbt).
# items: material, amount, optional name und enchants. commands: Konsolenbefehle (%player%).
kits:
  starter:
    name: "<green>Starter-Kit"
    icon: WOODEN_PICKAXE
    cooldown: -1
    permission: smpcore.kit.starter
    items:
      - {material: STONE_PICKAXE, amount: 1}
      - {material: STONE_AXE, amount: 1}
      - {material: STONE_SWORD, amount: 1}
      - {material: COOKED_BEEF, amount: 16}
      - {material: TORCH, amount: 32}
  daily:
    name: "<yellow>Tägliches Kit"
    icon: CHEST
    cooldown: 86400
    permission: ""
    items:
      - {material: BREAD, amount: 16}
      - {material: IRON_INGOT, amount: 8}
      - {material: EXPERIENCE_BOTTLE, amount: 8}
  premium:
    name: "<green>PREMIUM-Kit"
    icon: GOLDEN_CARROT
    cooldown: 86400
    permission: smpcore.kit.premium
    items:
      - {material: GOLDEN_CARROT, amount: 32}
      - {material: IRON_INGOT, amount: 16}
      - {material: DIAMOND, amount: 2}
  elite:
    name: "<gold>ELITE-Kit"
    icon: GOLDEN_APPLE
    cooldown: 86400
    permission: smpcore.kit.elite
    items:
      - {material: GOLDEN_APPLE, amount: 4}
      - {material: DIAMOND, amount: 4}
      - {material: EXPERIENCE_BOTTLE, amount: 32}
  mvp:
    name: "<#ff5555>MVP-Kit"
    icon: DIAMOND_PICKAXE
    cooldown: 86400
    permission: smpcore.kit.mvp
    items:
      - {material: DIAMOND_PICKAXE, amount: 1, enchants: {efficiency: 4, unbreaking: 3}}
      - {material: DIAMOND, amount: 8}
      - {material: GOLDEN_APPLE, amount: 8}
  ultra:
    name: "<#c040ff>ULTRA-Kit"
    icon: DIAMOND_SWORD
    cooldown: 86400
    permission: smpcore.kit.ultra
    items:
      - {material: DIAMOND_SWORD, amount: 1, enchants: {sharpness: 4, unbreaking: 3}}
      - {material: DIAMOND, amount: 16}
      - {material: ENDER_PEARL, amount: 8}
  vip:
    name: "<#55ccff>VIP-Kit"
    icon: NETHERITE_INGOT
    cooldown: 86400
    permission: smpcore.kit.vip
    items:
      - {material: NETHERITE_INGOT, amount: 1}
      - {material: DIAMOND_BLOCK, amount: 2}
      - {material: ENCHANTED_GOLDEN_APPLE, amount: 1}
      - {material: TOTEM_OF_UNDYING, amount: 1}
