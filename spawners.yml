    loot:
      - {material: COAL, min: 0, max: 2, chance: 100, sell: 8}
      - {material: BONE, min: 0, max: 2, chance: 100, sell: 4}
      - {material: WITHER_SKELETON_SKULL, min: 1, max: 1, chance: 2, sell: 2000}
  SLIME:
    xp: 4
    loot:
      - {material: SLIME_BALL, min: 1, max: 2, chance: 100, sell: 15}
