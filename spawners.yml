# SmartSpawner: Spawner spawnen keine Mobs, sondern erzeugen Loot + XP in einem virtuellen Lager.
# Rechtsklick auf den Spawner öffnet das Menü (Lager, XP, Verkaufen, Stapeln).
# Geben: /spawner give <Spieler> <Typ> [Anzahl]   (oder über Crates / Kristall-Shop / Admin Panel)
# loot: material, min, max (pro Zyklus und Spawner im Stapel), chance in %, sell = Verkaufspreis pro Stück
settings:
  interval-seconds: 15
  max-stack: 100
  max-storage: 50000
mobs:
  ZOMBIE:
    xp: 5
    loot:
      - {material: ROTTEN_FLESH, min: 1, max: 3, chance: 100, sell: 1}
      - {material: IRON_INGOT, min: 1, max: 1, chance: 3, sell: 25}
      - {material: CARROT, min: 1, max: 1, chance: 3, sell: 3}
  SKELETON:
    xp: 5
    loot:
      - {material: BONE, min: 1, max: 3, chance: 100, sell: 4}
      - {material: ARROW, min: 1, max: 3, chance: 100, sell: 1}
  SPIDER:
    xp: 5
    loot:
      - {material: STRING, min: 1, max: 3, chance: 100, sell: 4}
      - {material: SPIDER_EYE, min: 1, max: 1, chance: 30, sell: 5}
  CREEPER:
    xp: 5
    loot:
      - {material: GUNPOWDER, min: 1, max: 3, chance: 100, sell: 15}
  BLAZE:
    xp: 10
    loot:
      - {material: BLAZE_ROD, min: 1, max: 2, chance: 70, sell: 40}
  ZOMBIFIED_PIGLIN:
    xp: 5
    loot:
      - {material: ROTTEN_FLESH, min: 1, max: 2, chance: 100, sell: 1}
      - {material: GOLD_NUGGET, min: 1, max: 3, chance: 80, sell: 5}
      - {material: GOLD_INGOT, min: 1, max: 1, chance: 5, sell: 50}
  IRON_GOLEM:
    xp: 0
    loot:
      - {material: IRON_INGOT, min: 3, max: 5, chance: 100, sell: 25}
      - {material: POPPY, min: 1, max: 2, chance: 50, sell: 1}
  COW:
    xp: 3
    loot:
      - {material: BEEF, min: 1, max: 3, chance: 100, sell: 6}
      - {material: LEATHER, min: 0, max: 2, chance: 100, sell: 4}
  PIG:
    xp: 3
    loot:
      - {material: PORKCHOP, min: 1, max: 3, chance: 100, sell: 6}
  CHICKEN:
    xp: 3
    loot:
      - {material: CHICKEN, min: 1, max: 1, chance: 100, sell: 5}
      - {material: FEATHER, min: 0, max: 2, chance: 100, sell: 2}
  ENDERMAN:
    xp: 8
